# Necromancer Class Skills
#
# Stubs use MythicLib builtin handlers so the class is selectable and
# bindable now. Pet AI, corpse consumption, and army caps are NOT
# implemented here — MythicMobs (BUG BOt) wires those separately.
#
# --- MythicMobs handoff IDs (do not rename without updating trees) ---
# Skills (MythicLib / MMOCore unlock IDs):
#   NECROMANCER_RAISE_DEAD
#   NECROMANCER_SOUL_DRAIN
#   NECROMANCER_RAISE_ELITE
#   NECROMANCER_LIFE_SIPHON
#   NECROMANCER_DEATH_GRASP
#   NECROMANCER_RAISE_MINION
#   NECROMANCER_UNHOLY_COMMAND
#   NECROMANCER_CORPSE_EXPLOSION
#
# Intended MythicMobs cast skills (replace `source:` when ready):
#   mythicmobs:NecromancerRaiseDead_Cast
#   mythicmobs:NecromancerSoulDrain_Cast
#   mythicmobs:NecromancerRaiseElite_Cast
#   mythicmobs:NecromancerLifeSiphon_Cast
#   mythicmobs:NecromancerDeathGrasp_Cast
#   mythicmobs:NecromancerRaiseMinion_Cast
#   mythicmobs:NecromancerUnholyCommand_Cast
#   mythicmobs:NecromancerCorpseExplosion_Cast
#
# Intended MythicMobs mobs:
#   NecromancerMinion  — Lichlord army unit (hard cap 4)
#   NecromancerElite   — Reaper tank/assassin (hard cap 1)
#
# RULE: Raises are corpse-sourced only (real kills / nearby corpses).
#       No free timed spawn orbs.

# Shared default — corpse-sourced raise (behavior splits by spec once pets exist)
NECROMANCER_RAISE_DEAD:
  name: "&5Raise Dead"
  icon: SKELETON_SKULL
  # TODO [MythicMobs / BUG BOt]: source: mythicmobs:NecromancerRaiseDead_Cast
  # Consume a nearby corpse / recent kill. No free spawn.
  # Reaper: prefer upgrading toward elite. Lichlord: count toward army cap 4.
  source: default:WITHER
  parameters:
    cooldown:
      player:
        base: 12
        per-level: -0.08
        min: 6
        max: 12
      name: Cooldown
    mana:
      player:
        base: 14
        per-level: 0.22
      name: Mana
    duration:
      player:
        base: 4.0
        per-level: 0.06
      name: Duration
  triggers:
    cast:
      - 'potion{type=WITHER;duration={duration};amplifier=0}'
      - 'particle{p=SOUL;amount=80;speed=0.4;hS=1.5;vS=1.2}'
      - 'particle{p=SOUL_FIRE_FLAME;amount=30;speed=0.2;hS=1;vS=1}'
      - 'sound{s=ENTITY_WITHER_AMBIENT;v=1.2;p=0.7}'

