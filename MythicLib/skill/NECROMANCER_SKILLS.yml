        base: 4.0
        per-level: 0.25
      name: Heal
    duration:
      player:
        base: 3.0
        per-level: 0.05
      name: Duration
  triggers:
    cast:
      - 'damage{amount={damage}}'
      - 'heal{amount={heal}}'
      - 'potion{type=WITHER;duration={duration};amplifier=0}'
      - 'particle{p=DAMAGE_INDICATOR;amount=20;speed=0.3;hS=0.6;vS=0.6}'
